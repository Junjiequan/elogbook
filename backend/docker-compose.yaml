# Development and small deployments:  docker compose up -d db      (database only, run the API with npm)
#                                     docker compose up -d --build (database and API)
# A name of its own: without it Compose uses the folder name ("backend"), which other projects share.
name: elogbook

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elogbook
      POSTGRES_PASSWORD: elogbook
      POSTGRES_DB: elogbook
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - elogbook-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elogbook -d elogbook']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://elogbook:elogbook@db:5432/elogbook
      # Development only: set a real secret (openssl rand -base64 48) for anything else.
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4300,http://localhost:4200}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-anna.lindqvist@example.org}
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  elogbook-db:
