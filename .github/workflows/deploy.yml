name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Unit tests of both apps (the frontend in headless Chrome); no database needed.
      - run: npm test
        env:
          # The frontend specs run in the Chrome that is installed on the runner.
          CHROME_BIN: /usr/bin/google-chrome
      - name: Build for GitHub Pages
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: frontend/dist/elogbook/browser

  # The API's end-to-end tests: the real app against a real PostgreSQL.
  backend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elogbook
          POSTGRES_PASSWORD: elogbook
          POSTGRES_DB: elogbook_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U elogbook -d elogbook_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  deploy:
    if: github.ref == 'refs/heads/main'
    # Only the frontend is published here, so a failing API database test must not hold back the site.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
